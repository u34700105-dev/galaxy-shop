<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galaxy Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0820;--card:#140c2e;--line:#4a3a8a;--text:#f3eeff;--muted:#a99dd6;--err:#ff7b9c;--ok:#7dffb0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;
font-family:'Prompt',system-ui,sans-serif;color:var(--text);
background:radial-gradient(circle at 20% 10%,#3a1b7a 0,transparent 45%),radial-gradient(circle at 90% 90%,#5a1d8f 0,transparent 40%),var(--bg)}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 24px;box-shadow:0 0 40px rgba(150,80,255,.25)}
.head{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.head svg{width:64px;height:64px;flex:none}
h1{margin:0;font-size:30px;font-weight:600}
.sub{margin:4px 0 22px;color:var(--muted);font-size:15px}
.field{position:relative;margin-bottom:6px}
.field svg.ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:24px;height:24px;fill:#cfc4ff}
input{width:100%;height:56px;background:#1d1440;border:1px solid var(--line);border-radius:14px;color:var(--text);font:inherit;font-size:16px;padding:0 48px 0 52px}
input::placeholder{color:var(--muted)}
input:focus-visible,button:focus-visible{outline:2px solid #c78bff;outline-offset:2px}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:#cfc4ff;cursor:pointer;width:40px;height:40px;font-size:20px}
.hint{font-size:13px;color:var(--muted);margin:0 0 16px 6px;min-height:20px}
.hint.err{color:var(--err)}
.btn{width:100%;height:54px;border:0;border-radius:14px;color:#fff;font:inherit;font-size:17px;font-weight:600;cursor:pointer;background:linear-gradient(90deg,#7a2cff,#ff4fd8);margin-top:4px}
.btn:active{transform:scale(.99)}
.msg{margin:14px 0 0;text-align:center;font-size:14px;min-height:20px;color:var(--ok)}
.msg.err{color:var(--err)}
.or{display:flex;align-items:center;gap:12px;margin:22px 0 14px;color:var(--muted);font-size:14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.alt{display:grid;grid-template-columns:1fr;gap:10px}
.alt button{height:50px;border-radius:12px;border:1px solid var(--line);background:#1d1440;color:var(--text);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.alt button:focus-visible{outline:2px solid #c78bff;outline-offset:2px}
.alt .line{color:#06c755}
.alt .fb{color:#6ea8ff}
[hidden]{display:none!important}
#app{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;background:radial-gradient(circle at 85% 100%,#4b1c9e 0,transparent 45%),radial-gradient(circle at 0 0,#3a1b7a 0,transparent 40%),#07031a;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ah{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.logo b{font-size:20px;font-style:italic;font-weight:600}
.logo b span{color:#c26bff}
.logo small{display:block;font-size:11px;color:var(--muted)}
.bal{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:5px 16px 5px 5px;background:#150c33;font-weight:600}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#9a5cff,#ff4fd8);display:grid;place-items:center;font-size:18px}
.ac{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 12px}
.ac h2{margin:0 0 6px;font-size:22px;font-weight:600}
.ac p{color:var(--muted);margin:0 0 14px}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;border-top:1px solid var(--line);background:#0e0724}
.nav button{background:none;border:1px solid transparent;border-radius:14px;color:var(--muted);font:inherit;font-size:13px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav .i{font-size:22px}
.nav button[aria-current="true"]{color:#fff;border-color:var(--line);background:#1d1440;box-shadow:0 0 14px rgba(150,80,255,.4)}
.nav button:focus-visible{outline:2px solid #c78bff}
.out{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.back{display:block;margin:10px auto 0;background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;padding:8px}
.back:focus-visible{outline:2px solid #c78bff;outline-offset:2px}
#reg{overflow:visible}
.crown{display:block;width:84px;height:48px;margin:-52px auto 6px;padding:0 10px;background:var(--card);filter:drop-shadow(0 0 8px rgba(255,194,26,.7))}
.rt{text-align:center;font-style:italic;font-size:32px}
.new{display:inline-block;padding:.25em .25em .15em .1em;margin:-.25em -.25em -.15em -.1em;background:linear-gradient(90deg,#a855ff,#ff4fd8);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.rs{text-align:center}
#reg .hint{min-height:0;margin:0 0 12px 6px}
.agree{display:flex;align-items:center;gap:10px;font-size:14px;margin:4px 0 6px}
.agree input{width:22px;height:22px;padding:0;flex:none;accent-color:#9a3cff}
.lnk{background:none;border:0;padding:0;font:inherit;color:#ff6bf0;text-decoration:underline;cursor:pointer}
.lnk:focus-visible{outline:2px solid #c78bff;outline-offset:2px}
.ah{gap:8px;padding:10px 12px}
.logoimg{height:46px;width:auto;flex:none;min-width:0}
.rt2{display:flex;align-items:center;gap:6px;min-width:0}
.avimg{height:44px;width:auto;flex:none}
.balimg{height:38px;width:auto;flex:none}
.nav{display:block;position:relative;padding:6px 8px;gap:0;background:#07031a}
.nav>img{display:block;width:100%;height:auto}
.nav .tabs{position:absolute;inset:6px 8px;display:grid;grid-template-columns:repeat(3,1fr)}
.nav .tabs button{background:none;border:0;border-radius:16px;padding:0;box-shadow:none;cursor:pointer}
.nav .tabs button[aria-current="true"]{background:rgba(190,110,255,.18);box-shadow:inset 0 -3px 0 #fff,0 0 16px rgba(190,110,255,.5)}
.nav .tabs button:focus-visible{outline:2px solid #fff;outline-offset:-3px}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:4px 0 20px}
.games button{min-width:0;width:100%;padding:0;border:0;background:none;border-radius:16px;cursor:pointer;line-height:0;overflow:hidden}
.games img{width:100%;max-width:100%;height:auto;display:block}
.games button:focus-visible{outline:2px solid #c78bff;outline-offset:2px}
.games button:active{transform:scale(.98)}
.avbtn{background:none;border:0;padding:0;cursor:pointer;line-height:0;border-radius:50%}
.avbtn:focus-visible{outline:2px solid #c78bff;outline-offset:2px}
.inprof .ah{display:none}
#prof{flex:1;overflow:auto;background:radial-gradient(circle at 15% 80%,#3a1b7a 0,transparent 45%),radial-gradient(circle at 90% 60%,#4b1c9e 0,transparent 40%),#07031a}
.pbanner{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(#000 75%,transparent);mask-image:linear-gradient(#000 75%,transparent)}
.ppanel{position:relative;margin:-26px 12px 18px;padding:62px 16px 22px;border:2px solid #b45cff;border-radius:18px;text-align:center;background:rgba(10,4,32,.88);box-shadow:0 0 24px rgba(160,80,255,.5),inset 0 0 20px rgba(120,60,255,.3)}
.pav{position:absolute;left:50%;top:-52px;transform:translateX(-50%);width:104px;height:auto}
.pname{font-size:24px;font-weight:600;margin:0 0 10px;word-break:break-all}
.badge{display:inline-block;padding:6px 16px;border:1px solid #b45cff;border-radius:12px;background:#1a0b3d;font-size:15px}
.pbtn{display:flex;align-items:center;gap:14px;width:100%;margin-top:18px;padding:14px 16px;border:2px solid #b45cff;border-radius:16px;background:linear-gradient(90deg,#1b0c45,#10062c);color:#fff;font:inherit;font-size:17px;cursor:pointer;text-align:left;box-shadow:0 0 14px rgba(160,80,255,.45)}
.pbtn .ch{margin-left:auto;font-size:26px;line-height:1}
.pbtn:focus-visible,.pclose:focus-visible{outline:2px solid #fff;outline-offset:2px}
.plogout{justify-content:center;width:80%;margin:34px auto 0}
.contact{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#120a30;font-size:16px}
.contact a{color:#fff}
.pclose{position:absolute;top:10px;right:10px;width:42px;height:42px;border:2px solid #b45cff;border-radius:12px;background:#1a0b3d;color:#fff;font-size:20px;cursor:pointer}
.balpill{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 10px;border:2px solid #7a3cff;border-radius:14px;background:linear-gradient(#150c33,#0a0520);box-shadow:0 0 12px rgba(150,80,255,.5);font-weight:700;font-size:19px;white-space:nowrap;flex:none}
.balpill .bu{font-size:15px;font-weight:500;color:var(--muted)}
.gh{margin:4px 0 6px;font-size:22px;font-weight:600}
.gs{color:var(--muted);margin:0 0 14px;font-size:14px}
.lb{display:block;margin:12px 0 6px;font-size:14px;color:var(--muted)}
.fi{padding:0 14px;height:50px}
.fi[type=file]{height:auto;padding:12px}
.slipp{display:block;max-width:100%;max-height:260px;border-radius:12px;margin:8px 0}
.sec{margin:22px 0 8px;font-size:16px;font-weight:600}
.it{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#120a30;font-size:14px;line-height:1.6}
.it b{font-size:15px}
.mut{color:var(--muted);font-size:13px}
.chip{float:right;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.chip.no{color:var(--err);border-color:var(--err)}
.packs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:6px}
.pack{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:#120a30;color:var(--text);font:inherit;cursor:pointer;min-width:0}
.pack.wide{grid-column:1/-1}
.pack[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 14px rgba(190,110,255,.7);background:#1d1440}
.pack:focus-visible{outline:2px solid #c78bff;outline-offset:2px}
.pn{font-weight:600;font-size:16px}
.pp{color:#ffd54a;font-weight:600}
.pw{font-size:12px;color:var(--muted)}
.pw em{font-style:normal;color:var(--ok);margin-left:6px}
.pnote{font-size:12px;color:var(--muted);line-height:1.5;margin-top:2px}
.bar{position:sticky;bottom:-16px;margin:14px -12px -16px;padding:10px 12px;background:rgba(7,3,26,.97);border-top:1px solid var(--line)}
.bt{font-size:14px;margin-bottom:8px}
.bar .msg{margin:8px 0 0}
.tbanner{position:relative;margin:0 0 8px}
.tbanner img{display:block;width:100%;height:auto;border-radius:16px}
.tb-b{position:absolute;background:none;border:0;cursor:pointer;border-radius:12px}
.tb-b:focus-visible{outline:2px solid #fff}
.topt{display:block;width:100%;padding:0;margin:8px 0;border:0;background:none;cursor:pointer;line-height:0;border-radius:16px}
.topt img{display:block;width:100%;height:auto;border-radius:16px}
.topt:active{transform:scale(.99)}
.topt:focus-visible{outline:2px solid #c78bff;outline-offset:2px}
</style>
</head>
<body>
<main class="card" id="home">
  <div class="head">
    <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a5cff"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient></defs><circle cx="26" cy="20" r="12" fill="url(#g)"/><path d="M4 56c0-14 10-22 22-22s22 8 22 22z" fill="url(#g)"/><path d="M52 14v16M44 22h16" stroke="#c78bff" stroke-width="5" stroke-linecap="round"/></svg>
    <h1>เข้าสู่ระบบ</h1>
  </div>
  <p class="sub">เข้าสู่ระบบ เพื่อใช้บริการ</p>

  <div class="field">
    <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5"/><path d="M3 21c0-5 4-8 9-8s9 3 9 8z"/></svg>
    <input id="user" type="text" placeholder="ชื่อผู้ใช้ (Username)" autocomplete="username" aria-label="ชื่อผู้ใช้">
  </div>
  <p class="hint" id="uh">ใช้ได้ทั้งตัวอักษรและตัวเลข</p>

  <div class="field">
    <svg class="ic" viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 0 1 12 0v2h1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1zm2 0h8V8a4 4 0 0 0-8 0z"/></svg>
    <input id="pw" type="password" placeholder="รหัสผ่าน (Password)" autocomplete="new-password" aria-label="รหัสผ่าน">
    <button class="eye" id="eye" type="button" aria-label="แสดงหรือซ่อนรหัสผ่าน">👁</button>
  </div>
  <p class="hint" id="ph">รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร</p>

  <button class="btn" id="go" type="button">เข้าสู่ระบบ</button>
  <p class="msg" id="msg" role="status"></p>

  <div class="or">หรือ สมัครผ่านช่องทางอื่น</div>
  <div class="alt">
    <button type="button" id="newreg">สมัครสมาชิกใหม่</button>
  </div>
</main>
<main class="card" id="reg" hidden>
  <h1 class="rt">สมัครสมาชิก<span class="new">ใหม่</span></h1>
  <p class="sub rs">กรอกข้อมูลของคุณ เพื่อสร้างบัญชีใช้งาน</p>

  <div class="field">
    <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5"/><path d="M3 21c0-5 4-8 9-8s9 3 9 8z"/></svg>
    <input id="rn" type="text" placeholder="ชื่อผู้ใช้ (ชื่อที่ใช้ในการสมัคร)" autocomplete="username" aria-label="ชื่อผู้ใช้">
  </div>
  <p class="hint" id="rnh"></p>

  <div class="field">
    <svg class="ic" viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 8L4.5 7.5v1.2L12 14l7.5-5.3V7.5z"/></svg>
    <input id="re" type="email" placeholder="อีเมลของคุณ (ใช้สำหรับยืนยันบัญชี)" autocomplete="email" aria-label="อีเมล">
  </div>
  <p class="hint" id="reh"></p>

  <div class="field">
    <svg class="ic" viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 0 1 12 0v2h1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1zm2 0h8V8a4 4 0 0 0-8 0z"/></svg>
    <input id="rp1" type="password" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)" autocomplete="new-password" aria-label="รหัสผ่าน">
    <button class="eye" id="reye" type="button" aria-label="แสดงหรือซ่อนรหัสผ่าน">👁</button>
  </div>
  <p class="hint" id="rp1h"></p>

  <div class="field">
    <svg class="ic" viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 0 1 12 0v2h1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1zm2 0h8V8a4 4 0 0 0-8 0z"/></svg>
    <input id="rp2" type="password" placeholder="ยืนยันรหัสผ่านอีกครั้ง" autocomplete="new-password" aria-label="ยืนยันรหัสผ่าน">
  </div>
  <p class="hint" id="rp2h"></p>

  <label class="agree"><input type="checkbox" id="ra"><span>ฉันยอมรับ <button type="button" class="lnk">ข้อกำหนดและเงื่อนไข</button> และ <button type="button" class="lnk">นโยบายความเป็นส่วนตัว</button></span></label>
  <p class="hint" id="rah"></p>

  <button class="btn" id="rgo" type="button">สมัครสมาชิก</button>
  <p class="msg" id="rmsg" role="status"></p>
  <div class="or">หรือ สมัครผ่านช่องทางอื่น</div>
  <button class="back" id="back" type="button">กลับไปหน้าเดิม</button>
</main>
<div id="app" hidden>

function gameGrid(){
  const w=document.createElement('div');w.className='games';
  GAMES.forEach(g=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',g.name);
    const i=document.createElement('img');i.src=g.img;i.alt=g.name;b.appendChild(i);b.onclick=()=>showGame(g);w.appendChild(b)});
  return w;
}

const fmt=n=>Number(n||0).toLocaleString('en-US');
const when=ts=>{try{return ts.toDate().toLocaleString('th-TH')}catch(e){return ''}};
const STAT={pending:'รอดำเนินการ',processing:'กำลังเติม...',review:'รอตรวจสอบ',failed:'ไม่สำเร็จ',done:'เติมเกมแล้ว',approved:'เติมเงินแล้ว',rejected:'ไม่ผ่าน',cancelled:'ยกเลิก'};
const chip=s=>{const c=el('span','chip'+(s==='done'||s==='approved'?' ok':(s==='rejected'||s==='cancelled'||s==='failed'?' no':'')),STAT[s]||s);return c};
let unTab=null,unBal=null,curBal=0;
function stopTab(){if(unTab){unTab();unTab=null}}
function compress(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height));const w=Math.round(im.width*s),h=Math.round(im.height*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(url);
    let d=c.toDataURL('image/jpeg',0.6);if(d.length>650000)d=c.toDataURL('image/jpeg',0.4);res(d)};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('อ่านรูปไม่ได้'))};im.src=url})}
const SOON=new Set([]);
function showSoon(g){
  stopTab();
  const ac=$('ac');ac.textContent='';
  const b=el('button','back','‹ กลับไปเลือกเกม');b.type='button';b.style.margin='0 0 8px';b.onclick=()=>tab('home');
  ac.appendChild(b);ac.appendChild(el('h2','gh',g.name));ac.appendChild(el('p','gs','กำลังปรับปรุงรายการ เร็วๆ นี้'));
}
function showGame(g){
  stopTab();
  if(SOON.has(g.id)){showSoon(g);return}
  if(PACKS[g.id]){showPacks(g);return}
  showFree(g);
}
function showFree(g){
  stopTab();
  const ac=$('ac');
  ac.innerHTML='<h2 class="gh"></h2><p class="gs">กรอกข้อมูลแล้วกดสั่งซื้อ ทางร้านจะเติมเกมให้ <b>ห้ามกรอกรหัสผ่านเกม</b> ใช้เฉพาะไอดีผู้เล่น</p>'+
   '<label class="lb" for="o_id">ไอดีผู้เล่น (Player ID)</label><input class="fi" id="o_id" maxlength="40" autocomplete="off">'+
   '<label class="lb" for="o_item">รายการที่ต้องการ เช่น 100 เพชร</label><input class="fi" id="o_item" maxlength="120" autocomplete="off">'+
   '<p class="hint err" id="o_h"></p><button class="btn" id="o_go" type="button">สั่งซื้อ</button><p class="msg" id="o_m" role="status"></p>'+
   '<button class="back" id="o_b" type="button">กลับไปเลือกเกม</button>';
  ac.querySelector('.gh').textContent=g.name;
  $('o_b').onclick=()=>tab('home');
  $('o_go').onclick=async()=>{
    const pid=$('o_id').value.trim(),item=$('o_item').value.trim(),m=$('o_m'),h=$('o_h');
    m.textContent='';m.className='msg';h.textContent='';
    if(!pid||!item){h.textContent='กรุณากรอกไอดีผู้เล่นและรายการที่ต้องการ';return}
    const b=$('o_go');b.disabled=true;
    try{
      await addDoc(collection(db,'orders'),{uid:auth.currentUser.uid,username:who,game:g.name,playerId:pid,item:item,status:'pending',createdAt:serverTimestamp()});
      m.textContent='ส่งออเดอร์แล้ว ดูสถานะได้ที่เมนู "รายการสั่งซื้อล่าสุด"';$('o_id').value='';$('o_item').value='';
    }catch(e){m.className='msg err';m.textContent=errText(e)}
    b.disabled=false;
  };
}
function showPacks(g){
  const ac=$('ac'),data=PACKS[g.id];ac.textContent='';
  ac.appendChild(el('h2','gh',g.name));
  ac.appendChild(el('p','gs','กรอกไอดีผู้เล่น เลือกแพ็กเกจ แล้วกดสั่งซื้อ ห้ามกรอกรหัสผ่านเกม'));
  if(data.warn){const w=el('p','',data.warn);w.setAttribute('role','note');w.style.cssText='margin:8px 0;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,170,0,.55);background:rgba(255,170,0,.14);font-size:.92em;line-height:1.5';ac.appendChild(w)}
  const lab=el('label','lb',data.idLabel||'ไอดีผู้เล่น (Player ID)');lab.htmlFor='p_id';ac.appendChild(lab);
  const idIn=document.createElement('input');idIn.id='p_id';idIn.className='fi';idIn.maxLength=40;idIn.autocomplete='off';if(data.digits)idIn.inputMode='numeric';ac.appendChild(idIn);
  let sel=null;const btns=[];
  const bt=el('div','bt','ยังไม่ได้เลือกแพ็กเกจ');
  data.groups.forEach(gr=>{
    ac.appendChild(el('h3','sec',gr.title));
    const grid=el('div','packs');
    gr.items.forEach(p=>{
      const b=document.createElement('button');b.type='button';b.className='pack'+(p.note?' wide':'');b.setAttribute('aria-pressed','false');
      b.appendChild(el('span','pn',p.name));
      b.appendChild(el('span','pp',fmt(p.price)+' กีบ'));
      if(p.was){const w=el('span','pw');w.appendChild(el('s','',fmt(p.was)+' กีบ'));if(p.pct)w.appendChild(el('em','','-'+p.pct+'%'));b.appendChild(w)}
      if(p.note)b.appendChild(el('span','pnote',p.note));
      b.onclick=()=>{sel=p;btns.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));bt.textContent='เลือก: '+p.name+' · '+fmt(p.price)+' กีบ'};
      btns.push(b);grid.appendChild(b);
    });
    ac.appendChild(grid);
  });
  const back=el('button','back','กลับไปเลือกเกม');back.type='button';back.onclick=()=>tab('home');ac.appendChild(back);
  const bar=el('div','bar');const msg=el('p','msg');msg.setAttribute('role','status');
  const go=el('button','btn','สั่งซื้อ');go.type='button';
  bar.appendChild(bt);bar.appendChild(go);bar.appendChild(msg);ac.appendChild(bar);
  go.onclick=async()=>{
    msg.textContent='';msg.className='msg err';
    const pid=idIn.value.trim();
    if(!pid){msg.textContent='กรุณากรอกไอดีผู้เล่น';idIn.focus();return}
    if(data.digits&&!/^[0-9]{5,20}$/.test(pid)){msg.textContent='UID ต้องเป็นตัวเลขเท่านั้น';idIn.focus();return}
    if(!sel){msg.textContent='กรุณาเลือกแพ็กเกจ';return}
    if(curBal<sel.price){msg.textContent='ยอดเงินไม่พอ (มี '+fmt(curBal)+' กีบ) กรุณาเติมเครดิตก่อน';return}
    go.disabled=true;
    try{
      if(autoMode&&sel.auto){
        await placeOrderFn({game:g.id,packId:sel.id,playerId:pid});
        msg.className='msg';msg.textContent='ส่งออเดอร์แล้ว ระบบกำลังเติมเกมให้อัตโนมัติ ดูสถานะที่เมนู "รายการสั่งซื้อล่าสุด"';
      }else{
        await addDoc(collection(db,'orders'),{uid:auth.currentUser.uid,username:who,game:g.name,playerId:pid,item:sel.name,packId:sel.id,status:'pending',createdAt:serverTimestamp()});
        msg.className='msg';msg.textContent='ส่งออเดอร์แล้ว ดูสถานะที่เมนู "รายการสั่งซื้อล่าสุด"';
      }
    }catch(e){msg.textContent=(e&&String(e.code||'').indexOf('functions/')===0&&e.message&&e.message!=='internal')?e.message:errText(e)}
    go.disabled=false;
  };
}

function topupCard9(){
  stopTab();const ac=$('ac');ac.textContent='';
  const b=el('button','back','‹ กลับ');b.type='button';b.style.margin='0 0 8px';b.onclick=()=>tab('topup');
  ac.appendChild(b);ac.appendChild(el('h2','gh','บัตรหลัก 9 (บัตรติดพัน)'));ac.appendChild(el('p','gs','ระบบนี้กำลังเตรียมเปิดใช้งาน เร็วๆ นี้'));
}
function renderOrders(ac){
  ac.appendChild(el('h2','gh','รายการสั่งซื้อล่าสุด'));
  const list=el('div');ac.appendChild(list);
  unTab=onSnapshot(query(collection(db,'orders'),where('uid','==',auth.currentUser.uid)),snap=>{
    const rows=snap.docs.map(d=>d.data()).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).slice(0,30);
    list.textContent='';
    if(!rows.length){list.appendChild(el('p','gs','ยังไม่มีรายการสั่งซื้อ'));return}
    rows.forEach(o=>{const c=el('div','it');const t=el('div');t.appendChild(chip(o.status));t.appendChild(el('b','',o.game));c.appendChild(t);
      const pk=o.packId?findPack(o.packId):null;c.appendChild(el('div','',o.item+' · ID: '+o.playerId+(pk?' · '+fmt(o.price||pk.price)+' กีบ':'')));if(o.failureReason)c.appendChild(el('div','mut',o.failureReason+(o.refunded?' (คืนเงินแล้ว)':'')));c.appendChild(el('div','mut',when(o.createdAt)));list.appendChild(c)});
  },()=>{list.textContent='โหลดรายการไม่สำเร็จ'});
}

  const qb=el('div');qb.style.cssText='margin:10px 0 14px;text-align:center';

function tab(t){
  closeProf();stopTab();
  const ac=$('ac');ac.textContent='';
  if(t==='home')ac.appendChild(gameGrid());
  else if(t==='topup')renderTopup(ac);
  else renderOrders(ac);
  document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.t===t?'true':'false'));
}

function showApp(){$('home').hidden=true;$('reg').hidden=true;$('app').hidden=false;tab('home')}
function showHome(){$('app').hidden=true;$('reg').hidden=true;$('home').hidden=false}
const avSrc=document.querySelector('.avimg').src;$('pavimg').src=avSrc;
function closeProf(){$('prof').hidden=true;$('ac').hidden=false;$('app').classList.remove('inprof')}
$('avbtn').onclick=()=>{$('pname').textContent=who;$('contact').hidden=true;$('ac').hidden=true;$('prof').hidden=false;$('app').classList.add('inprof')};
$('pclose').onclick=closeProf;
$('pcontact').onclick=()=>{$('contact').hidden=!$('contact').hidden};
$('plogout').onclick=()=>{closeProf();signOut(auth)};
$('pcopy').onclick=async()=>{try{await navigator.clipboard.writeText('2092018344');$('pcopy').textContent='คัดลอกแล้ว'}catch(e){}};
onAuthStateChanged(auth,u=>{
  if(unBal){unBal();unBal=null}
  stopTab();
  if(u){who=(u.email||'').replace(DOMAIN,'');showApp();
    const u1=onSnapshot(doc(db,'users',u.uid),s=>{curBal=s.exists()?(s.data().balance||0):0;$('balnum').textContent=fmt(curBal)},()=>{});
    const u2=onSnapshot(doc(db,'config','shop'),s=>{autoMode=!!(s.exists()&&s.data().autoTopup===true)},()=>{autoMode=false});
    unBal=()=>{u1();u2()};
  }else{$('balnum').textContent='0';showHome()}
});
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
$('eye').onclick=()=>{$('pw').type=$('pw').type==='password'?'text':'password'};
$('reye').onclick=()=>{const t=$('rp1').type==='password'?'text':'password';$('rp1').type=t;$('rp2').type=t};
$('newreg').onclick=()=>{$('home').hidden=true;$('reg').hidden=false;$('rn').focus()};
$('back').onclick=()=>{$('reg').hidden=true;$('home').hidden=false};

$('go').onclick=async()=>{
  const u=$('user').value.trim().toLowerCase(),p=$('pw').value,m=$('msg');
  m.textContent='';m.className='msg';
  let ok=true;
  if(!UNAME.test(u)){hint('uh','ใช้ตัวอักษรอังกฤษหรือตัวเลข 3–20 ตัว',1);ok=false}else hint('uh','ใช้ได้ทั้งตัวอักษรและตัวเลข');
  if(p.length<6){hint('ph','รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร',1);ok=false}else hint('ph','รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
  if(!ok)return;
  const b=$('go');b.disabled=true;
  try{await signInWithEmailAndPassword(auth,u+DOMAIN,p)}
  catch(e){m.className='msg err';m.textContent=errText(e)}
  b.disabled=false;
};

$('rgo').onclick=async()=>{
  const u=$('rn').value.trim().toLowerCase(),mail=$('re').value.trim(),a=$('rp1').value,c=$('rp2').value,rm=$('rmsg');
  rm.textContent='';rm.className='msg';
  let ok=true;
  if(!UNAME.test(u)){hint('rnh','ชื่อผู้ใช้ใช้ a-z และตัวเลข 3–20 ตัว',1);ok=false}else hint('rnh','');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)){hint('reh','รูปแบบอีเมลไม่ถูกต้อง เช่น name@example.com',1);ok=false}else hint('reh','');
  if(a.length<6){hint('rp1h','รหัสผ่านสั้นไป ต้องมีอย่างน้อย 6 ตัวอักษร',1);ok=false}else hint('rp1h','');
  if(c!==a||c===''){hint('rp2h','รหัสผ่านสองช่องไม่ตรงกัน',1);ok=false}else hint('rp2h','');
  if(!$('ra').checked){hint('rah','กรุณาติ๊กยอมรับข้อกำหนดและเงื่อนไข',1);ok=false}else hint('rah','');
  if(!ok)return;
  const b=$('rgo');b.disabled=true;
  try{
    const cred=await createUserWithEmailAndPassword(auth,u+DOMAIN,a);
    await setDoc(doc(db,'users',cred.user.uid),{username:u,email:mail,balance:0,createdAt:serverTimestamp()});
  }catch(e){rm.className='msg err';rm.textContent=errText(e)}
  b.disabled=false;
};
