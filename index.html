<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galaxy Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1116;--card:#151a22;--line:#2a303b;--text:#eef0f4;--muted:#9aa3b2;--err:#f08a9b;--ok:#7fd9a6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;
font-family:'Prompt',system-ui,sans-serif;color:var(--text);
background:radial-gradient(circle at 20% 10%,#3a1b7a 0,transparent 45%),radial-gradient(circle at 90% 90%,#5a1d8f 0,transparent 40%),var(--bg)}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 24px;box-shadow:0 0 40px rgba(150,80,255,.25)}
.head{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.head svg{width:64px;height:64px;flex:none}
h1{margin:0;font-size:30px;font-weight:600}
.sub{margin:4px 0 22px;color:var(--muted);font-size:15px}
.field{position:relative;margin-bottom:6px}
.field svg.ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:24px;height:24px;fill:#c3cad6}
input{width:100%;height:56px;background:#1c222c;border:1px solid var(--line);border-radius:14px;color:var(--text);font:inherit;font-size:16px;padding:0 48px 0 52px}
input::placeholder{color:var(--muted)}
input:focus-visible,button:focus-visible{outline:2px solid #b8a9ff;outline-offset:2px}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:#c3cad6;cursor:pointer;width:40px;height:40px;font-size:20px}
.hint{font-size:13px;color:var(--muted);margin:0 0 16px 6px;min-height:20px}
.hint.err{color:var(--err)}
.btn{width:100%;height:54px;border:0;border-radius:14px;color:#fff;font:inherit;font-size:17px;font-weight:600;cursor:pointer;background:linear-gradient(90deg,#b8a9ff,#b8a9ff);margin-top:4px}
.btn:active{transform:scale(.99)}
.msg{margin:14px 0 0;text-align:center;font-size:14px;min-height:20px;color:var(--ok)}
.msg.err{color:var(--err)}
.or{display:flex;align-items:center;gap:12px;margin:22px 0 14px;color:var(--muted);font-size:14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.alt{display:grid;grid-template-columns:1fr;gap:10px}
.alt button{height:50px;border-radius:12px;border:1px solid var(--line);background:#1c222c;color:var(--text);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.alt button:focus-visible{outline:2px solid #b8a9ff;outline-offset:2px}
.alt .line{color:#06c755}
.alt .fb{color:#6ea8ff}
[hidden]{display:none!important}
#app{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;background:radial-gradient(circle at 85% 100%,#4b1c9e 0,transparent 45%),radial-gradient(circle at 0 0,#3a1b7a 0,transparent 40%),#0b0e13;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ah{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.logo b{font-size:20px;font-style:normal;font-weight:600}
.logo b span{color:#b8a9ff}
.logo small{display:block;font-size:11px;color:var(--muted)}
.bal{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:5px 16px 5px 5px;background:#151a22;font-weight:600}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#b8a9ff,#b8a9ff);display:grid;place-items:center;font-size:18px}
.ac{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 12px}
.ac h2{margin:0 0 6px;font-size:22px;font-weight:600}
.ac p{color:var(--muted);margin:0 0 14px}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;border-top:1px solid var(--line);background:#0b0e13}
.nav button{background:none;border:1px solid transparent;border-radius:14px;color:var(--muted);font:inherit;font-size:13px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav .i{font-size:22px}
.nav button[aria-current="true"]{color:#fff;border-color:var(--line);background:#1c222c;box-shadow:0 0 14px rgba(150,80,255,.4)}
.nav button:focus-visible{outline:2px solid #b8a9ff}
.out{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.back{display:block;margin:10px auto 0;background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;padding:8px}
.back:focus-visible{outline:2px solid #b8a9ff;outline-offset:2px}
#reg{overflow:visible}
.crown{display:block;width:84px;height:48px;margin:-52px auto 6px;padding:0 10px;background:var(--card);filter:drop-shadow(0 0 8px rgba(255,194,26,.7))}
.rt{text-align:center;font-style:normal;font-size:32px}
.new{display:inline-block;padding:.25em .25em .15em .1em;margin:-.25em -.25em -.15em -.1em;background:linear-gradient(90deg,#b8a9ff,#b8a9ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.rs{text-align:center}
#reg .hint{min-height:0;margin:0 0 12px 6px}
.agree{display:flex;align-items:center;gap:10px;font-size:14px;margin:4px 0 6px}
.agree input{width:22px;height:22px;padding:0;flex:none;accent-color:#b8a9ff}
.lnk{background:none;border:0;padding:0;font:inherit;color:#b8a9ff;text-decoration:underline;cursor:pointer}
.lnk:focus-visible{outline:2px solid #b8a9ff;outline-offset:2px}
.ah{gap:8px;padding:10px 12px}
.logoimg{height:46px;width:auto;flex:none;min-width:0}
.rt2{display:flex;align-items:center;gap:6px;min-width:0}
.avimg{height:44px;width:auto;flex:none}
.balimg{height:38px;width:auto;flex:none}
.nav{display:block;position:relative;padding:6px 8px;gap:0;background:#0b0e13}
.nav>img{display:block;width:100%;height:auto}
.nav .tabs{position:absolute;inset:6px 8px;display:grid;grid-template-columns:repeat(3,1fr)}
.nav .tabs button{background:none;border:0;border-radius:16px;padding:0;box-shadow:none;cursor:pointer}
.nav .tabs button[aria-current="true"]{background:rgba(190,110,255,.18);box-shadow:inset 0 -3px 0 #fff,0 0 16px rgba(190,110,255,.5)}
.nav .tabs button:focus-visible{outline:2px solid #fff;outline-offset:-3px}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:4px 0 20px}
.games button{min-width:0;width:100%;padding:0;border:0;background:none;border-radius:16px;cursor:pointer;line-height:0;overflow:hidden}
.games img{width:100%;max-width:100%;height:auto;display:block}
.games button:focus-visible{outline:2px solid #b8a9ff;outline-offset:2px}
.games button:active{transform:scale(.98)}
.avbtn{background:none;border:0;padding:0;cursor:pointer;line-height:0;border-radius:50%}
.avbtn:focus-visible{outline:2px solid #b8a9ff;outline-offset:2px}
.inprof .ah{display:none}
#prof{flex:1;overflow:auto;background:radial-gradient(circle at 15% 80%,#3a1b7a 0,transparent 45%),radial-gradient(circle at 90% 60%,#4b1c9e 0,transparent 40%),#0b0e13}
.pbanner{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(#000 75%,transparent);mask-image:linear-gradient(#000 75%,transparent)}
.ppanel{position:relative;margin:-26px 12px 18px;padding:62px 16px 22px;border:2px solid #3a4150;border-radius:18px;text-align:center;background:rgba(10,4,32,.88);box-shadow:0 0 24px rgba(160,80,255,.5),inset 0 0 20px rgba(120,60,255,.3)}
.pav{position:absolute;left:50%;top:-52px;transform:translateX(-50%);width:104px;height:auto}
.pname{font-size:24px;font-weight:600;margin:0 0 10px;word-break:break-all}
.badge{display:inline-block;padding:6px 16px;border:1px solid #3a4150;border-radius:12px;background:#1c222c;font-size:15px}
.pbtn{display:flex;align-items:center;gap:14px;width:100%;margin-top:18px;padding:14px 16px;border:2px solid #3a4150;border-radius:16px;background:linear-gradient(90deg,#1c222c,#12161d);color:#fff;font:inherit;font-size:17px;cursor:pointer;text-align:left;box-shadow:0 0 14px rgba(160,80,255,.45)}
.pbtn .ch{margin-left:auto;font-size:26px;line-height:1}
.pbtn:focus-visible,.pclose:focus-visible{outline:2px solid #fff;outline-offset:2px}
.plogout{justify-content:center;width:80%;margin:34px auto 0}
.contact{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#12161d;font-size:16px}
.contact a{color:#fff}
.pclose{position:absolute;top:10px;right:10px;width:42px;height:42px;border:2px solid #3a4150;border-radius:12px;background:#1c222c;color:#fff;font-size:20px;cursor:pointer}
.balpill{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 10px;border:2px solid #3a4150;border-radius:14px;background:linear-gradient(#151a22,#0e1116);box-shadow:0 0 12px rgba(150,80,255,.5);font-weight:600;font-size:19px;white-space:nowrap;flex:none}
.balpill .bu{font-size:15px;font-weight:500;color:var(--muted)}
.gh{margin:4px 0 6px;font-size:22px;font-weight:600}
.gs{color:var(--muted);margin:0 0 14px;font-size:14px}
.lb{display:block;margin:12px 0 6px;font-size:14px;color:var(--muted)}
.fi{padding:0 14px;height:50px}
.fi[type=file]{height:auto;padding:12px}
.slipp{display:block;max-width:100%;max-height:260px;border-radius:12px;margin:8px 0}
.sec{margin:22px 0 8px;font-size:16px;font-weight:600}
.it{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#12161d;font-size:14px;line-height:1.6}
.it b{font-size:15px}
.mut{color:var(--muted);font-size:13px}
.chip{float:right;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.chip.no{color:var(--err);border-color:var(--err)}
.packs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:6px}
.pack{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:#12161d;color:var(--text);font:inherit;cursor:pointer;min-width:0}
.pack.wide{grid-column:1/-1}
.pack[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 14px rgba(190,110,255,.7);background:#1c222c}
.pack:focus-visible{outline:2px solid #b8a9ff;outline-offset:2px}
.pn{font-weight:600;font-size:16px}
.pp{color:#ffd54a;font-weight:600}
.pw{font-size:12px;color:var(--muted)}
.pw em{font-style:normal;color:var(--ok);margin-left:6px}
.pnote{font-size:12px;color:var(--muted);line-height:1.5;margin-top:2px}
.bar{position:sticky;bottom:-16px;margin:14px -12px -16px;padding:10px 12px;background:rgba(7,3,26,.97);border-top:1px solid var(--line)}
.bt{font-size:14px;margin-bottom:8px}
.bar .msg{margin:8px 0 0}
.tbanner{position:relative;margin:0 0 8px}
.tbanner img{display:block;width:100%;height:auto;border-radius:16px}
.tb-b{position:absolute;background:none;border:0;cursor:pointer;border-radius:12px}
.tb-b:focus-visible{outline:2px solid #fff}
.topt{display:block;width:100%;padding:0;margin:8px 0;border:0;background:none;cursor:pointer;line-height:0;border-radius:16px}
.topt img{display:block;width:100%;height:auto;border-radius:16px}
.topt:active{transform:scale(.99)}
.topt:focus-visible{outline:2px solid #b8a9ff;outline-offset:2px}

/* unslop: quiet chrome, one accent, no glow */
body,#app,#prof{background:#0b0e13!important}
.card,.ppanel,.balpill,.bal,.pbtn,#menu,#fab,.pack[aria-pressed="true"],.nav .tabs button[aria-current="true"],.nav button[aria-current="true"]{box-shadow:none!important}
.card{border-radius:16px}
.btn{background:#b8a9ff!important;color:#15111f!important;font-weight:600}
.btn.alt{background:#1c222c!important;color:#eef0f4!important}
.btn.no{background:#2a1519!important;color:#f08a9b!important}
.pbtn{background:#1c222c!important;border:1px solid #2a303b!important}
.ppanel{border:1px solid #2a303b!important;background:#12161d!important}
.balpill{border:1px solid #2a303b!important;background:#151a22!important;border-radius:12px}
.crown{filter:none!important}
.new{background:none!important;-webkit-text-fill-color:currentColor!important;color:#b8a9ff!important}
.av{background:#1c222c!important}
.pack[aria-pressed="true"]{border-color:#b8a9ff!important}
#menu button{border:1px solid #2a303b}
#fab{background:#eef0f4!important}

.nav{padding:0!important;border-top:1px solid #2a303b}
.nav .tabs{position:static!important;display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.nav .tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;height:60px;justify-content:center;border-radius:0!important;color:#9aa3b2;font:inherit;font-size:12px}
.nav .tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav .tabs button[aria-current="true"]{background:none!important;color:#eef0f4;box-shadow:inset 0 2px 0 #b8a9ff!important}
.eye svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.eye .sl{stroke-width:2}.eye.on .sl{display:none}
</style>
</head>
<body>
<main class="card" id="home">
  <div class="head">
    <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8a9ff"/><stop offset="1" stop-color="#b8a9ff"/></linearGradient></defs><circle cx="26" cy="20" r="12" fill="url(#g)"/><path d="M4 56c0-14 10-22 22-22s22 8 22 22z" fill="url(#g)"/><path d="M52 14v16M44 22h16" stroke="#b8a9ff" stroke-width="5" stroke-linecap="round"/></svg>
    <h1>เข้าสู่ระบบ</h1>
  </div>
  <p class="sub">เข้าสู่ระบบ เพื่อใช้บริการ</p>

  <div class="field">
    <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5"/><path d="M3 21c0-5 4-8 9-8s9 3 9 8z"/></svg>
    <input id="user" type="text" placeholder="ชื่อผู้ใช้ (Username)" autocomplete="username" aria-label="ชื่อผู้ใช้">
  </div>
  <p class="hint" id="uh">ใช้ได้ทั้งตัวอักษรและตัวเลข</p>

  <div class="field">
    <svg class="ic" viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 0 1 12 0v2h1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1zm2 0h8V8a4 4 0 0 0-8 0z"/></svg>
    <input id="pw" type="password" placeholder="รหัสผ่าน (Password)" autocomplete="new-password" aria-label="รหัสผ่าน">
    <button class="eye" id="eye" type="button" aria-label="แสดงหรือซ่อนรหัสผ่าน"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="sl" d="M4 4l16 16"/></svg></button>
  </div>
  <p class="hint" id="ph">รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร</p>

  <button class="btn" id="go" type="button">เข้าสู่ระบบ</button>
  <p class="msg" id="msg" role="status"></p>

  <div class="or">หรือ สมัครผ่านช่องทางอื่น</div>
  <div class="alt">
    <button type="button" id="newreg">สมัครสมาชิกใหม่</button>
  </div>
</main>
<main class="card" id="reg" hidden>
  <h1 class="rt">สมัครสมาชิก<span class="new">ใหม่</span></h1>
  <p class="sub rs">กรอกข้อมูลของคุณ เพื่อสร้างบัญชีใช้งาน</p>

  <div class="field">
    <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5"/><path d="M3 21c0-5 4-8 9-8s9 3 9 8z"/></svg>
    <input id="rn" type="text" placeholder="ชื่อผู้ใช้ (ชื่อที่ใช้ในการสมัคร)" autocomplete="username" aria-label="ชื่อผู้ใช้">
  </div>
  <p class="hint" id="rnh"></p>

  <div class="field">
    <svg class="ic" viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 8L4.5 7.5v1.2L12 14l7.5-5.3V7.5z"/></svg>
    <input id="re" type="email" placeholder="อีเมลของคุณ (ใช้สำหรับยืนยันบัญชี)" autocomplete="email" aria-label="อีเมล">
  </div>
  <p class="hint" id="reh"></p>

  <div class="field">
    <svg class="ic" viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 0 1 12 0v2h1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1zm2 0h8V8a4 4 0 0 0-8 0z"/></svg>
    <input id="rp1" type="password" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)" autocomplete="new-password" aria-label="รหัสผ่าน">
    <button class="eye" id="reye" type="button" aria-label="แสดงหรือซ่อนรหัสผ่าน"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="sl" d="M4 4l16 16"/></svg></button>
  </div>
  <p class="hint" id="rp1h"></p>

  <div class="field">
    <svg class="ic" viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 0 1 12 0v2h1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1zm2 0h8V8a4 4 0 0 0-8 0z"/></svg>
    <input id="rp2" type="password" placeholder="ยืนยันรหัสผ่านอีกครั้ง" autocomplete="new-password" aria-label="ยืนยันรหัสผ่าน">
  </div>
  <p class="hint" id="rp2h"></p>

  <label class="agree"><input type="checkbox" id="ra"><span>ฉันยอมรับ <button type="button" class="lnk">ข้อกำหนดและเงื่อนไข</button> และ <button type="button" class="lnk">นโยบายความเป็นส่วนตัว</button></span></label>
  <p class="hint" id="rah"></p>

  <button class="btn" id="rgo" type="button">สมัครสมาชิก</button>
  <p class="msg" id="rmsg" role="status"></p>
  <div class="or">หรือ สมัครผ่านช่องทางอื่น</div>
  <button class="back" id="back" type="button">กลับไปหน้าเดิม</button>
</main>

function gameGrid(){
  const w=document.createElement('div');w.className='games';
  GAMES.forEach(g=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',g.name);
    const i=document.createElement('img');i.src=g.img;i.alt=g.name;b.appendChild(i);if(g.wide)b.style.gridColumn='1 / -1';b.onclick=()=>showGame(g);w.appendChild(b)});
  return w;
}
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const fmt=n=>Number(n||0).toLocaleString('en-US');
const when=ts=>{try{return ts.toDate().toLocaleString('th-TH')}catch(e){return ''}};
const STAT={pending:'รอดำเนินการ',processing:'กำลังเติม...',review:'รอตรวจสอบ',failed:'ไม่สำเร็จ',done:'เติมสำเร็จ',approved:'เติมเงินแล้ว',rejected:'ไม่ผ่าน',cancelled:'ยกเลิก'};
const chip=s=>{const c=el('span','chip'+(s==='done'||s==='approved'?' ok':(s==='rejected'||s==='cancelled'||s==='failed'?' no':'')),STAT[s]||s);return c};
let unTab=null,unBal=null,curBal=0,stopOrdersOv=null;
function stopTab(){if(unTab){unTab();unTab=null}if(stopOrdersOv){stopOrdersOv();stopOrdersOv=null}}
function compress(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height));const w=Math.round(im.width*s),h=Math.round(im.height*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(url);
    let d=c.toDataURL('image/jpeg',0.6);if(d.length>650000)d=c.toDataURL('image/jpeg',0.4);res(d)};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('อ่านรูปไม่ได้'))};im.src=url})}
const SOON=new Set([]);
function showSoon(g){
  stopTab();
  const ac=$('ac');ac.textContent='';
  const b=el('button','back','‹ กลับไปเลือกเกม');b.type='button';b.style.margin='0 0 8px';b.onclick=()=>tab('home');
  ac.appendChild(b);ac.appendChild(el('h2','gh',g.name));ac.appendChild(el('p','gs','กำลังปรับปรุงรายการ เร็วๆ นี้'));
}
function showGame(g){
  stopTab();
  if(SOON.has(g.id)){showSoon(g);return}
  if(g.id==='ids'){showIdMenu();return}
  if(PACKS[g.id]){showPacks(g);return}

function showIdMenu(){
  stopTab();
  const ac=$('ac');ac.textContent='';
  ac.appendChild(el('h2','gh','สินค้าและบริการ Blox Fruits'));
  ac.appendChild(el('p','gs','เลือกประเภทที่ต้องการ'));
  const w=document.createElement('div');w.className='games';w.style.gridTemplateColumns='minmax(0,1fr)';
  SELL.forEach(x=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',x.name);
    const i=document.createElement('img');i.src=x.img;i.alt=x.name;b.appendChild(i);b.onclick=()=>showPacks(x);w.appendChild(b)});

function showFree(g){
  stopTab();
  const ac=$('ac');
  ac.innerHTML='<h2 class="gh"></h2><p class="gs">กรอกข้อมูลแล้วกดสั่งซื้อ ทางร้านจะเติมเกมให้ <b>ห้ามกรอกรหัสผ่านเกม</b> ใช้เฉพาะไอดีผู้เล่น</p>'+
   '<label class="lb" for="o_id">ไอดีผู้เล่น (Player ID)</label><input class="fi" id="o_id" maxlength="40" autocomplete="off">'+
   '<label class="lb" for="o_item">รายการที่ต้องการ เช่น 100 เพชร</label><input class="fi" id="o_item" maxlength="120" autocomplete="off">'+
   '<p class="hint err" id="o_h"></p><button class="btn" id="o_go" type="button">สั่งซื้อ</button><p class="msg" id="o_m" role="status"></p>'+
   '<button class="back" id="o_b" type="button">กลับไปเลือกเกม</button>';
  ac.querySelector('.gh').textContent=g.name;
  $('o_b').onclick=()=>tab('home');
  $('o_go').onclick=async()=>{
    const pid=$('o_id').value.trim(),item=$('o_item').value.trim(),m=$('o_m'),h=$('o_h');
    m.textContent='';m.className='msg';h.textContent='';
    if(!pid||!item){h.textContent='กรุณากรอกไอดีผู้เล่นและรายการที่ต้องการ';return}
    const b=$('o_go');b.disabled=true;
    try{
      await addDoc(collection(db,'orders'),{uid:auth.currentUser.uid,username:who,game:g.name,playerId:pid,item:item,status:'pending',createdAt:serverTimestamp()});
      m.textContent='ส่งออเดอร์แล้ว ดูสถานะได้ที่เมนู "รายการสั่งซื้อล่าสุด"';$('o_id').value='';$('o_item').value='';
    }catch(e){m.className='msg err';m.textContent=errText(e)}
    b.disabled=false;
  };
}
const SHOP_PHONE='2092018344';
function otCss(){
  if(!$('ottcss')){const st=document.createElement('style');st.id='ottcss';st.textContent=
   '.ot-ov{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.4)}'+
   '.ot-box{width:100%;max-width:320px;padding:26px 20px 22px;border-radius:14px;background:#fff;text-align:center;color:#545454;box-shadow:0 8px 30px rgba(0,0,0,.35);animation:otp .25s ease-out}'+
   '@keyframes otp{from{transform:scale(.8);opacity:0}}'+
   '.ot-ic{width:72px;height:72px;margin:0 auto 14px;border:4px solid #a5dc86;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;line-height:1;color:#a5dc86}'+
   '.ot-t{margin:0 0 10px;font-size:24px;font-weight:600;color:#3a3a3a}'+
   '.ot-p{margin:4px 0;font-size:15px;line-height:1.5}'+
   '.ot-ph{display:block;margin:8px 0 14px;font-size:30px;font-weight:600;letter-spacing:1px;color:#3a3a3a;user-select:all}'+
   '.ot-ok{min-width:96px;height:42px;padding:0 28px;border:0;border-radius:8px;background:#7066e0;color:#fff;font:inherit;font-size:16px;cursor:pointer}'+
   '.ot-ok:active{background:#5b52c4}';
   document.head.appendChild(st)}
}
function showOrderToast(item){
  otCss();
  const ov=el('div','ot-ov'),box=el('div','ot-box');ov.appendChild(box);
  const close=()=>{if(ov.parentNode)ov.parentNode.removeChild(ov)};
  ov.onclick=e=>{if(e.target===ov)close()};
  box.appendChild(el('div','ot-ic','✓'));
  box.appendChild(el('h3','ot-t','สั่งซื้อสำเร็จ'));
  box.appendChild(el('p','ot-p','กรุณาทักเบอร์นี้ เพื่อรับผลในเกม'));
  box.appendChild(el('span','ot-ph',SHOP_PHONE));
  const ok=el('button','ot-ok','OK');ok.type='button';ok.onclick=close;box.appendChild(ok);
  document.body.appendChild(ov);
}

  note.style.cssText='margin:12px 0 4px;padding:8px 10px;border-radius:8px;background:#fff3cd;color:#7a5b00;font-size:12px;line-height:1.5';box.appendChild(note);

    ok.disabled=no.disabled=true;
    try{
      const uid=auth.currentUser.uid;
      const cands=(poolIds[p.id]||[]).slice().sort(()=>Math.random()-.5);
      if(!cands.length)throw new Error('ไอดีนี้หมดแล้ว');
      let got=null,lastErr=null;
      for(const accId of cands){
        const uref=doc(db,'users',uid),pref=doc(db,'idPool',accId),oref=doc(collection(db,'orders'));
        const odata={uid:uid,username:who,game:'ขายไอดี',playerId:'ดูในประวัติ',item:p.name,packId:p.id,accId:accId,price:p.price,status:'pending',createdAt:serverTimestamp()};

            tx.update(uref,{balance:bal-p.price});
            tx.update(pref,{sold:true,buyer:uid,orderId:oref.id});
            tx.set(oref,odata);
          });
          got=accId;break;
        }catch(e){
          lastErr=e;
          if(e&&(e.message==='TAKEN'||e.code==='permission-denied'||e.code==='aborted'))continue;
          throw e;
        }
      }
      if(!got)throw (lastErr&&lastErr.code==='permission-denied')?lastErr:new Error('ไอดีนี้หมดแล้ว');
      let sec=null;try{const sd=await getDoc(doc(db,'idSecrets',got));if(sd.exists())sec=sd.data()}catch(e){}
      showIdResult(p,sec);
      close();return;
    }catch(e){
      msg.textContent=(e&&e.message&&(e.message==='ไอดีนี้หมดแล้ว'||e.message.indexOf('ยอดเงินไม่พอ')===0))?e.message:errText(e);
      ok.disabled=no.disabled=false;
    }
  };
}

function renderOrders(ac){
  ac.appendChild(el('h2','gh','รายการสั่งซื้อล่าสุด'));
  const bar=el('div');bar.style.cssText='display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px';ac.appendChild(bar);
  const list=el('div');ac.appendChild(list);
  let rows=[],openGame=null,ov=null;
  const closeOv=()=>{if(ov){ov.remove();ov=null}openGame=null};
  const drawOv=()=>{
    if(!openGame)return;
    const mine=rows.filter(o=>o.game===openGame);
    if(!mine.length){closeOv();return}
    if(!ov){
      ov=el('div');ov.style.cssText='position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.75);display:grid;place-items:center;padding:14px';
      ov.onclick=ev=>{if(ev.target===ov)closeOv()};document.body.appendChild(ov);
    }
    ov.textContent='';
    const box=el('div');box.setAttribute('role','dialog');box.style.cssText='width:100%;max-width:420px;max-height:80vh;overflow:auto;background:#151a22;border:2px solid #3a4150;border-radius:18px;padding:16px;box-shadow:0 0 24px rgba(160,80,255,.5)';
    const hd=el('div');hd.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-bottom:10px';
    hd.appendChild(el('b','',openGame));
    const x=el('button','','✕');x.type='button';x.setAttribute('aria-label','ปิด');x.style.cssText='width:38px;height:38px;border:1px solid #3a4150;border-radius:10px;background:#1c222c;color:#fff;font-size:18px;cursor:pointer';x.onclick=closeOv;hd.appendChild(x);box.appendChild(hd);
    const fruit=openGame==='ขายผลปีศาจ'||openGame==='ขายไอดี',flbl=openGame==='ขายไอดี'?'ไอดีที่ซื้อ: ':'ผลที่ซื้อ: ';
    mine.forEach(o=>{
      const c=el('div','it');
      const t=el('div');t.appendChild(chip(o.accId?'done':o.status));t.appendChild(el('b','',fruit?flbl+o.item:o.item));c.appendChild(t);
      if(o.accId){
        const sb=el('div','');sb.style.cssText='margin:6px 0;padding:8px;border-radius:10px;background:#1c222c;word-break:break-all;user-select:all';sb.textContent='กำลังโหลดไอดี...';c.appendChild(sb);
        getDoc(doc(db,'idSecrets',o.accId)).then(sd=>{sb.textContent='';if(!sd.exists()){sb.textContent='ไม่พบข้อมูลไอดี กรุณาทักร้าน';return}const x=sd.data();sb.appendChild(el('div','','ชื่อผู้ใช้: '+x.user));sb.appendChild(el('div','','รหัสผ่าน: '+x.pass))}).catch(()=>{sb.textContent='โหลดไอดีไม่สำเร็จ ลองเปิดใหม่อีกครั้ง'});
      }else c.appendChild(el('div','',(fruit?'ติดต่อ: ':'ID: ')+o.playerId));
      c.appendChild(el('div','mut','วันที่ '+when(o.createdAt)));
      const busy=!o.accId&&(o.status==='pending'||o.status==='processing'||o.status==='review');
      if(busy){c.appendChild(el('div','mut','ลบไม่ได้ขณะที่ร้านกำลังดำเนินการ'))}
      else{
        const d=el('button','','ลบรายการนี้');d.type='button';d.style.cssText='width:100%;height:42px;margin-top:8px;border-radius:10px;border:1px solid #f08a9b;background:#2a1519;color:#f08a9b;font:inherit;cursor:pointer';
        d.onclick=async()=>{
          if(!confirm('ลบรายการนี้ออกจากหน้าของคุณ?'))return;
          d.disabled=true;
          try{await updateDoc(doc(db,'orders',o.id),{hiddenByUser:true})}catch(err){d.disabled=false;alert('ลบไม่สำเร็จ ลองใหม่อีกครั้ง')}
        };
        c.appendChild(d);
      }
      box.appendChild(c);
    });
    ov.appendChild(box);
  };
  stopOrdersOv=closeOv;
  unTab=onSnapshot(query(collection(db,'orders'),where('uid','==',auth.currentUser.uid)),snap=>{
    rows=snap.docs.map(d=>({id:d.id,...d.data()})).filter(o=>!o.hiddenByUser).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).slice(0,30);
    bar.textContent='';
    [...new Set(rows.map(o=>o.game))].forEach(g=>{
      const b=el('button','chip',g+' ('+rows.filter(o=>o.game===g).length+') ›');b.type='button';b.style.cssText='float:none;padding:8px 14px;font:inherit;font-size:14px;background:#1c222c;color:#fff;cursor:pointer';
      b.onclick=()=>{openGame=g;drawOv()};bar.appendChild(b);
    });
    if(openAfter&&rows.some(o=>o.game===openAfter)){openGame=openAfter;openAfter=null}
    list.textContent='';
    if(!rows.length){list.appendChild(el('p','gs','ยังไม่มีรายการสั่งซื้อ'));drawOv();return}
    rows.forEach(o=>{const c=el('div','it');const t=el('div');t.appendChild(chip(o.status));t.appendChild(el('b','',o.game));c.appendChild(t);
      const pk=o.packId?findPack(o.packId):null;c.appendChild(el('div','',o.item+' · ID: '+o.playerId+(pk?' · '+fmt(o.price||pk.price)+' กีบ':'')));if(o.failureReason)c.appendChild(el('div','mut',o.failureReason+(o.refunded?' (คืนเงินแล้ว)':'')));c.appendChild(el('div','mut',when(o.createdAt)));list.appendChild(c)});
    drawOv();
  },()=>{list.textContent='โหลดรายการไม่สำเร็จ'});
}

function tab(t){
  closeProf();stopTab();
  const ac=$('ac');ac.textContent='';
  if(t==='home')ac.appendChild(gameGrid());
  else if(t==='topup')renderTopup(ac);
  else renderOrders(ac);
  document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.t===t?'true':'false'));
}

  if(unBal){unBal();unBal=null}
  stopTab();
  if(u){who=(u.email||'').replace(DOMAIN,'');showApp();
    const u1=onSnapshot(doc(db,'users',u.uid),s=>{curBal=s.exists()?(s.data().balance||0):0;$('balnum').textContent=fmt(curBal)},()=>{});
    const u2=onSnapshot(doc(db,'config','shop'),s=>{autoMode=!!(s.exists()&&s.data().autoTopup===true)},()=>{autoMode=false});
    unBal=()=>{u1();u2()};
  }else{$('balnum').textContent='0';showHome()}
});
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
$('eye').onclick=()=>{$('pw').type=$('pw').type==='password'?'text':'password';$('eye').classList.toggle('on',$('pw').type==='text')};
$('reye').onclick=()=>{const t=$('rp1').type==='password'?'text':'password';$('rp1').type=t;$('rp2').type=t;$('reye').classList.toggle('on',t==='text')};
$('newreg').onclick=()=>{$('home').hidden=true;$('reg').hidden=false;$('rn').focus()};
$('back').onclick=()=>{$('reg').hidden=true;$('home').hidden=false};

$('go').onclick=async()=>{
  const u=$('user').value.trim().toLowerCase(),p=$('pw').value,m=$('msg');
  m.textContent='';m.className='msg';
  let ok=true;
  if(!UNAME.test(u)){hint('uh','ใช้ตัวอักษรอังกฤษหรือตัวเลข 3–20 ตัว',1);ok=false}else hint('uh','ใช้ได้ทั้งตัวอักษรและตัวเลข');
  if(p.length<6){hint('ph','รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร',1);ok=false}else hint('ph','รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
  if(!ok)return;
  const b=$('go');b.disabled=true;
  try{await signInWithEmailAndPassword(auth,u+DOMAIN,p)}
  catch(e){m.className='msg err';m.textContent=errText(e)}
  b.disabled=false;
};

$('rgo').onclick=async()=>{
  const u=$('rn').value.trim().toLowerCase(),mail=$('re').value.trim(),a=$('rp1').value,c=$('rp2').value,rm=$('rmsg');
  rm.textContent='';rm.className='msg';
  let ok=true;
  if(!UNAME.test(u)){hint('rnh','ชื่อผู้ใช้ใช้ a-z และตัวเลข 3–20 ตัว',1);ok=false}else hint('rnh','');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)){hint('reh','รูปแบบอีเมลไม่ถูกต้อง เช่น name@example.com',1);ok=false}else hint('reh','');
  if(a.length<6){hint('rp1h','รหัสผ่านสั้นไป ต้องมีอย่างน้อย 6 ตัวอักษร',1);ok=false}else hint('rp1h','');
  if(c!==a||c===''){hint('rp2h','รหัสผ่านสองช่องไม่ตรงกัน',1);ok=false}else hint('rp2h','');
  if(!$('ra').checked){hint('rah','กรุณาติ๊กยอมรับข้อกำหนดและเงื่อนไข',1);ok=false}else hint('rah','');
  if(!ok)return;
  const b=$('rgo');b.disabled=true;
  try{
    const cred=await createUserWithEmailAndPassword(auth,u+DOMAIN,a);
    await setDoc(doc(db,'users',cred.user.uid),{username:u,email:mail,balance:0,createdAt:serverTimestamp()});
  }catch(e){rm.className='msg err';rm.textContent=errText(e)}
  b.disabled=false;
};

/* รีเซ็ตระบบ: เมื่อแอดมินกดรีเซ็ต หน้านี้จะล้างแคชแล้วโหลดใหม่ (ล็อกอินค้างอยู่เหมือนเดิม) */
(function(){
  let first=true,last=null;
  try{
    onSnapshot(doc(db,'system','fruitStock'),s=>{
      fruitStock=s.exists()?(s.data()||{}):{};
      const a=$('ac');
      if(curPack&&(curPack.id==='fruits'||curPack.id==='dungeon')&&a&&a.querySelector('.packs')&&(a.querySelector('h2.gh')||{}).textContent===curPack.name)showPacks(curPack);
    },()=>{});
    onSnapshot(collection(db,'idPool'),s=>{
      soldMap={};poolLeft={};poolIds={};
      s.forEach(d=>{const x=d.data()||{},k=x.item;if(!k)return;if(x.sold)soldMap[k]=(soldMap[k]||0)+1;else{poolLeft[k]=(poolLeft[k]||0)+1;(poolIds[k]=poolIds[k]||[]).push(d.id)}});
      const a=$('ac');
      if(curPack&&curPack.id==='dungeon'&&a&&a.querySelector('.packs')&&(a.querySelector('h2.gh')||{}).textContent===curPack.name)showPacks(curPack);
    },()=>{});
    onSnapshot(doc(db,'system','prices'),s=>{
      const ov=s.exists()?(s.data()||{}):{};
      const fix=p=>{if(p._p0===undefined)p._p0=p.price;p.price=Number.isFinite(ov[p.id])?ov[p.id]:p._p0};
      for(const k in PACKS)PACKS[k].groups.forEach(gr=>gr.items.forEach(p=>{
        if(p.variants){p.variants.forEach(fix);const ps=p.variants.map(v=>v.price).filter(x=>x>0);p.price=ps.length?Math.min.apply(null,ps):0}
        else fix(p);
      }));
      const a=$('ac');
      if(curPack&&a&&a.querySelector('.packs')&&(a.querySelector('h2.gh')||{}).textContent===curPack.name)showPacks(curPack);
    },()=>{});
    onSnapshot(doc(db,'system','reset'),async snap=>{
      const t=snap.exists()&&snap.data().at?snap.data().at.seconds:0;
      if(first){first=false;last=t;return}
      if(!t||t===last)return;
      last=t;
      try{if('caches' in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}
      try{if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}}catch(e){}
      location.reload();
    },()=>{});
  }catch(e){}
})();
</script>
