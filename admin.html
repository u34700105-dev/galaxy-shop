<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Galaxy Shop Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07031a;--card:#140c2e;--line:#4a3a8a;--text:#f3eeff;--muted:#a99dd6;--err:#ff7b9c;--ok:#7dffb0}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Prompt',system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 0,#3a1b7a 0,transparent 45%),var(--bg);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:20px;margin:6px 0 14px;font-weight:600}
h2{font-size:18px;margin:6px 0 12px;font-weight:600}
input{width:100%;height:48px;background:#1d1440;border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;font-size:16px;padding:0 14px}
input:focus-visible,button:focus-visible{outline:2px solid #c78bff;outline-offset:2px}
.btn{height:46px;border:0;border-radius:12px;color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(90deg,#7a2cff,#ff4fd8);padding:0 16px}
.btn.alt{background:#1d1440;border:1px solid var(--line)}
.btn.no{background:#2a1030;border:1px solid var(--err);color:var(--err)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;margin-top:10px}
.row>*{flex:1}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;background:#120a30;line-height:1.7;font-size:15px}
.mut{color:var(--muted);font-size:13px}
.err{color:var(--err)}
.ok{color:var(--ok)}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px;display:grid;gap:12px}
#fab{position:fixed;left:14px;top:50%;transform:translateY(-50%);width:58px;height:58px;border-radius:50%;border:0;background:#fff;box-shadow:0 0 0 4px rgba(190,110,255,.35),0 4px 18px rgba(0,0,0,.5);cursor:pointer;display:grid;place-items:center;z-index:20}
#fab svg{width:26px;height:26px}
#menu{position:fixed;left:84px;top:50%;transform:translateY(-50%);z-index:20;background:#140c2e;border:2px solid #b45cff;border-radius:16px;padding:8px;box-shadow:0 0 24px rgba(160,80,255,.5);display:grid;gap:6px;width:min(250px,calc(100vw - 100px));animation:pop .15s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-50%) scale(.9)}to{opacity:1;transform:translateY(-50%) scale(1)}}
#menu button{background:#1d1440;border:1px solid var(--line);border-radius:12px;color:#fff;font:inherit;font-size:15px;text-align:left;padding:14px 12px;cursor:pointer}
#menu button:active{background:#2a1a60}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:grid;place-items:center;padding:10px}
#lb img{max-width:100%;max-height:100%}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a1030;border:1px solid var(--err);color:#fff;padding:10px 16px;border-radius:12px;z-index:40;max-width:90vw}
.slip{display:block;width:100%;max-height:300px;object-fit:contain;background:#000;border-radius:10px;margin:8px 0;cursor:zoom-in}
.cnt{margin:0 0 10px}
@media(prefers-reduced-motion:reduce){#menu{animation:none}}
.ban{display:block;width:100%;height:auto;border-radius:18px}
.abtn{display:block;width:100%;padding:0;border:0;background:none;margin:8px 0;line-height:0;cursor:pointer;border-radius:16px}
.abtn img{display:block;width:100%;height:auto}
.abtn:active{transform:scale(.99)}
.abtn:focus-visible{outline:2px solid #c78bff;outline-offset:2px}
.sec2{margin:18px 0 6px;font-size:17px;font-weight:600}
.gt{margin:12px 0 6px}
.pr{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;margin-bottom:6px}
body.homebg{background:#0a0420}
#home{min-height:100vh;background:#0a0420}
.hs{position:relative;width:100%;max-width:560px;margin:0 auto}
.himg{display:block;width:100%;height:auto}
.htitle{position:absolute;left:5%;top:1.6%;margin:0;font-size:clamp(20px,6.2vw,32px);font-weight:600;text-shadow:0 0 14px #b45cff}
.hot{position:absolute;left:3.4%;width:93.2%;height:9.2%;background:none;border:0;border-radius:18px;cursor:pointer}
.hot:active{background:rgba(190,110,255,.22)}
.hot:focus-visible{outline:2px solid #fff;outline-offset:-3px}
.hu{position:absolute;left:50%;transform:translateX(-50%);top:91.2%;padding:10px 20px;border-radius:999px;border:1px solid #b45cff;background:rgba(20,8,50,.85);color:#fff;font:inherit;font-size:15px;cursor:pointer;white-space:nowrap}
.hu:focus-visible{outline:2px solid #fff}
.bigc{text-align:center;padding:18px}
.bign{font-size:56px;font-weight:700;line-height:1.1;color:#fff;text-shadow:0 0 16px #b45cff}
.catbar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(7,3,26,.97);border-top:1px solid #b45cff}
.catbar button{height:48px;border-radius:12px;border:1px solid var(--line);background:#1d1440;color:var(--text);font:inherit;font-size:13px;cursor:pointer;padding:0 4px}
.catbar button[aria-pressed="true"]{border-color:#fff;background:#3a1b7a;box-shadow:0 0 12px rgba(190,110,255,.7)}
.catbar button:focus-visible{outline:2px solid #c78bff}
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <h1>Galaxy Shop · Admin</h1>
  <input id="u" placeholder="ชื่อผู้ใช้" autocomplete="username" aria-label="ชื่อผู้ใช้">
  <input id="p" type="password" placeholder="รหัสผ่าน" autocomplete="current-password" aria-label="รหัสผ่าน">
  <button class="btn" id="lg" type="button">เข้าสู่ระบบ</button>
  <p class="err" id="lm" role="status"></p>
</div>

<div id="noadmin" class="login" hidden>
  <h1>ไม่มีสิทธิ์เข้าหน้านี้</h1>
  <p class="mut">บัญชีนี้ไม่ได้เป็นแอดมิน</p>
  <button class="btn alt" id="lo1" type="button">ออกจากระบบ</button>
</div>

<div id="main" hidden>
  <div id="home" hidden></div>
  <div class="wrap" id="wrap" hidden>
    <h1>Galaxy Shop · Admin</h1>
    <div id="view"></div>
  </div>
  <button id="fab" type="button" aria-label="เมนูแอดมิน" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="#3a1b7a" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div id="menu" hidden>
    <button type="button" data-v="home">🏠 หน้าแอดมิน</button>
    <button type="button" data-v="products">🛒 รายการสินค้า</button>
    <button type="button" data-v="slips">🧾 ตรวจสลิป</button>
    <button type="button" data-v="orders">📦 ออเดอร์</button>
    <button type="button" data-v="users">👥 บัญชีผู้ใช้งาน</button>
    <button type="button" data-v="out">ออกจากระบบ</button>
  </div>
  <div id="lb" hidden><img alt="สลิป"></div>
</div>
<div id="toast" hidden role="alert"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,updateDoc,addDoc,deleteDoc,collection,query,where,onSnapshot,runTransaction,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {PACKS,findPack} from "./packs.js";
const app=initializeApp({
  apiKey:"AIzaSyBn5DB363vlF__1KjhPEgEqGgONiaXZq10",
  authDomain:"galaxy-shop-8cb4b.firebaseapp.com",
  projectId:"galaxy-shop-8cb4b",
  storageBucket:"galaxy-shop-8cb4b.firebasestorage.app",
  messagingSenderId:"854045350869",
  appId:"1:854045350869:web:fba9a2ac3ce83bb7797b5c"
});
const auth=getAuth(app),db=getFirestore(app);
const DOMAIN='@galaxyshop.local';
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const fmt=n=>Number(n||0).toLocaleString('en-US');
const when=ts=>{try{return ts.toDate().toLocaleString('th-TH')}catch(e){return ''}};
const secs=o=>(o.createdAt&&o.createdAt.seconds)||0;
let unsub=null,tt=null;
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,4000)}
const emsg=e=>(e&&e.message&&!String(e.message).startsWith('Firebase'))?e.message:'ทำรายการไม่สำเร็จ ลองใหม่อีกครั้ง';
function stop(){if(unsub){unsub();unsub=null}}
function show(id){['login','noadmin','main'].forEach(x=>$(x).hidden=x!==id)}

onAuthStateChanged(auth,async u=>{
  stop();closeMenu();
  if(!u){show('login');return}
  try{
    const s=await getDoc(doc(db,'admins',u.uid));
    if(s.exists()){show('main');viewHome()}
    else show('noadmin');
  }catch(e){show('noadmin')}
});
$('lg').onclick=async()=>{
  const u=$('u').value.trim().toLowerCase(),p=$('p').value,m=$('lm');m.textContent='';
  if(!u||!p){m.textContent='กรอกชื่อผู้ใช้และรหัสผ่าน';return}
  $('lg').disabled=true;
  try{await signInWithEmailAndPassword(auth,u+DOMAIN,p)}catch(e){m.textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'}
  $('lg').disabled=false;
};
$('lo1').onclick=()=>signOut(auth);

function closeMenu(){$('menu').hidden=true;$('fab').setAttribute('aria-expanded','false')}
$('fab').onclick=e=>{e.stopPropagation();const open=$('menu').hidden;$('menu').hidden=!open;$('fab').setAttribute('aria-expanded',String(open))};
document.addEventListener('click',e=>{if(!$('menu').contains(e.target))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();$('lb').hidden=true}});
$('lb').onclick=()=>$('lb').hidden=true;
function go(v){
  stop();
  if(v==='orders')viewOrders();else if(v==='slips')viewSlips();else if(v==='users')viewUsers();
  else if(v==='products')viewProducts();else if(v==='home')viewHome();else signOut(auth);
}
$('menu').onclick=e=>{const b=e.target.closest('button');if(!b)return;closeMenu();go(b.dataset.v)};
function setView(title){
  const v=$('view');v.replaceChildren();$('fab').hidden=false;$('home').hidden=true;$('wrap').hidden=false;document.body.classList.remove('homebg');
  const bk=el('button','btn alt','‹ กลับ');bk.style.cssText='height:36px;margin-bottom:8px';bk.onclick=()=>go('home');
  v.appendChild(bk);v.appendChild(el('h2','',title));
  const box=el('div');v.appendChild(box);return box;
}

  stop();closeMenu();$('fab').hidden=true;$('wrap').hidden=true;document.body.classList.add('homebg');

const CATS=[['v4','เผ่า V4 เทียร์ 10'],['awaken','ผลตื่น'],['normal','ID ปกติ']];
let curCat='v4';
function viewProducts(){
  const box=setView('รายการสินค้า · Blox Fruits');
  const form=el('div','card'),list=el('div'),bar=el('div','catbar');
  const head=el('b','');
  const mk=(ph)=>{const i=document.createElement('input');i.placeholder=ph;i.setAttribute('aria-label',ph);i.autocomplete='off';i.setAttribute('autocapitalize','off');i.style.marginTop='8px';return i};
  const uIn=mk('ชื่อผู้ใช้ไอดี'),pIn=mk('รหัสผ่านไอดี'),prIn=mk('ราคา (กีบ)'),nIn=mk('หมายเหตุ (ไม่บังคับ)');prIn.inputMode='numeric';
  const add=el('button','btn','เพิ่มสต๊อก');add.style.cssText='width:100%;margin-top:10px';
  [head,uIn,pIn,prIn,nIn,add].forEach(x=>form.appendChild(x));
  box.appendChild(form);box.appendChild(list);box.appendChild(bar);
  const label=()=>CATS.find(c=>c[0]===curCat)[1];
  add.onclick=async()=>{
    const u=uIn.value.trim(),pw=pIn.value.trim(),pr=parseAmt(prIn.value);
    if(!u||!pw){toast('กรอกชื่อผู้ใช้และรหัสผ่านของไอดี');return}
    if(!pr){toast('กรอกราคาเป็นตัวเลข');return}
    add.disabled=true;
    try{
      await addDoc(collection(db,'stock'),{game:'blox-fruits',cat:curCat,username:u,password:pw,price:pr,note:nIn.value.trim().slice(0,200),status:'available',createdAt:serverTimestamp()});
      uIn.value=pIn.value=prIn.value=nIn.value='';
    }catch(e){toast(emsg(e))}
    add.disabled=false;
  };
  const drawBar=()=>{bar.replaceChildren();CATS.forEach(c=>{const b=el('button','',c[1]);b.type='button';b.setAttribute('aria-pressed',String(c[0]===curCat));b.onclick=()=>{curCat=c[0];drawBar();load()};bar.appendChild(b)})};
  const load=()=>{
    stop();head.textContent='เพิ่มสต๊อก: '+label();
    list.replaceChildren(el('p','mut','กำลังโหลด...'));
    unsub=onSnapshot(query(collection(db,'stock'),where('cat','==',curCat)),snap=>{
      const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>secs(y)-secs(x));
      list.replaceChildren();
      list.appendChild(el('p','mut cnt','หมวด '+label()+' · '+rows.length+' ไอดี (พร้อมขาย '+rows.filter(r=>r.status==='available').length+')'));
      if(!rows.length){list.appendChild(el('p','mut','ยังว่างอยู่'));return}
      rows.forEach(r=>{
        const c=el('div','card');
        c.appendChild(el('b','',r.username));
        const pr=el('div','','รหัสผ่าน: ');const pv=el('span','','••••••••');pr.appendChild(pv);
        const sh=el('button','btn alt','แสดง');sh.style.cssText='height:28px;margin-left:8px;padding:0 10px;font-size:13px';
        let shown=false;sh.onclick=()=>{shown=!shown;pv.textContent=shown?r.password:'••••••••';sh.textContent=shown?'ซ่อน':'แสดง'};
        pr.appendChild(sh);c.appendChild(pr);
        c.appendChild(el('div','ok',fmt(r.price)+' กีบ'));
        if(r.note)c.appendChild(el('div','mut',r.note));
        c.appendChild(el('div',r.status==='available'?'ok':'mut',r.status==='available'?'พร้อมขาย':'ขายแล้ว'));
        const row=el('div','row');
        const tg=el('button','btn alt',r.status==='available'?'ทำเครื่องหมายขายแล้ว':'ตั้งเป็นพร้อมขาย');
        tg.onclick=async()=>{tg.disabled=true;try{await updateDoc(doc(db,'stock',r.id),{status:r.status==='available'?'sold':'available'})}catch(e){toast(emsg(e));tg.disabled=false}};
        const del=el('button','btn no','ลบ');
        del.onclick=async()=>{if(!confirm('ลบไอดีนี้ออกจากสต๊อก?'))return;del.disabled=true;try{await deleteDoc(doc(db,'stock',r.id))}catch(e){toast(emsg(e));del.disabled=false}};
        row.appendChild(tg);row.appendChild(del);c.appendChild(row);list.appendChild(c);
      });
    },e=>toast('โหลดสต๊อกไม่สำเร็จ: '+(e.code||'')));
  };
  drawBar();load();
}
function parseAmt(s){const n=parseInt(String(s).replace(/[^0-9]/g,''),10);return Number.isFinite(n)&&n>0&&n<1000000000?n:0}

/* 1) รายการสั่งซื้อ */
function viewOrders(){
  const box=setView('รายการสั่งซื้อที่รอเติม');
  unsub=onSnapshot(query(collection(db,'orders'),where('status','==','pending')),snap=>{
    const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>secs(a)-secs(b));
    box.replaceChildren();
    if(!rows.length){box.appendChild(el('p','mut','ยังไม่มีออเดอร์ที่รอเติม'));return}
    box.appendChild(el('p','mut cnt','รอเติม '+rows.length+' รายการ (เก่าสุดอยู่บน)'));
    rows.forEach(o=>{
      const c=el('div','card');
      c.appendChild(el('b','',o.game));
      c.appendChild(el('div','','ลูกค้า: '+o.username));
      const idr=el('div','','ไอดีผู้เล่น: ');const idb=el('b','',o.playerId);idr.appendChild(idb);
      const cp=el('button','btn alt','คัดลอก');cp.style.cssText='height:30px;margin-left:8px;padding:0 10px;font-size:13px';
      cp.onclick=async()=>{try{await navigator.clipboard.writeText(o.playerId);cp.textContent='คัดลอกแล้ว'}catch(e){toast('คัดลอกไม่ได้')}};
      idr.appendChild(cp);c.appendChild(idr);
      const pk=o.packId?findPack(o.packId):null,price=pk?pk.price:0;
      c.appendChild(el('div','','รายการ: '+o.item));
      if(price)c.appendChild(el('div','ok','ราคา: '+fmt(price)+' กีบ (หักจากยอดลูกค้าตอนกดเติมเกมแล้ว)'));
      c.appendChild(el('div','mut',when(o.createdAt)));
      const ch=document.createElement('input');ch.inputMode='numeric';ch.placeholder='หักยอดลูกค้า (กีบ) ไม่บังคับ';ch.style.marginTop='8px';ch.setAttribute('aria-label','หักยอดลูกค้า');
      if(price)ch.value=String(price);c.appendChild(ch);
      const r=el('div','row');
      const ok=el('button','btn','เติมเกมแล้ว ✓'),no=el('button','btn no','ยกเลิก');
      ok.onclick=async()=>{
        const charge=ch.value.trim()?parseAmt(ch.value):0;
        if(ch.value.trim()&&!charge){toast('จำนวนเงินที่หักไม่ถูกต้อง');return}
        ok.disabled=no.disabled=true;
        try{
          await runTransaction(db,async tx=>{
            const or=doc(db,'orders',o.id),os=await tx.get(or);
            if(!os.exists()||os.data().status!=='pending')throw new Error('ออเดอร์นี้ถูกจัดการไปแล้ว');
            let ur=null,bal=0;
            if(charge>0){ur=doc(db,'users',o.uid);const us=await tx.get(ur);if(!us.exists())throw new Error('ไม่พบบัญชีลูกค้า');bal=us.data().balance||0;if(bal<charge)throw new Error('ยอดเงินลูกค้าไม่พอ (มี '+fmt(bal)+' กีบ)')}
            if(ur)tx.update(ur,{balance:bal-charge});
            tx.update(or,{status:'done',charged:charge,doneAt:serverTimestamp()});
          });
        }catch(e){toast(emsg(e));ok.disabled=no.disabled=false}
      };
      no.onclick=async()=>{
        if(!confirm('ยกเลิกออเดอร์นี้?'))return;
        ok.disabled=no.disabled=true;
        try{await updateDoc(doc(db,'orders',o.id),{status:'cancelled',doneAt:serverTimestamp()})}catch(e){toast(emsg(e));ok.disabled=no.disabled=false}
      };
      r.appendChild(ok);r.appendChild(no);c.appendChild(r);box.appendChild(c);
    });
  },e=>toast('โหลดออเดอร์ไม่สำเร็จ: '+(e.code||'')));
}

/* 2) ตรวจสลิปและเติมเงิน */
function viewSlips(){
  const box=setView('สลิปที่รอตรวจสอบ');
  unsub=onSnapshot(query(collection(db,'topups'),where('status','==','pending')),snap=>{
    const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>secs(a)-secs(b));
    box.replaceChildren();
    if(!rows.length){box.appendChild(el('p','mut','ยังไม่มีสลิปที่รอตรวจ'));return}
    box.appendChild(el('p','mut cnt','รอตรวจ '+rows.length+' รายการ'));
    rows.forEach(t=>{
      const c=el('div','card');
      c.appendChild(el('b','','ลูกค้า: '+t.username));
      c.appendChild(el('div','mut',when(t.createdAt)));
      const im=document.createElement('img');im.className='slip';im.alt='สลิปของ '+t.username;im.src=t.slip;
      im.onclick=()=>{$('lb').firstElementChild.src=t.slip;$('lb').hidden=false};
      c.appendChild(im);
      const amt=document.createElement('input');amt.inputMode='numeric';amt.placeholder='จำนวนเงินที่ลูกค้าโอน (กีบ)';amt.setAttribute('aria-label','จำนวนเงิน');
      c.appendChild(amt);
      const r=el('div','row');
      const ok=el('button','btn','ยืนยันและเพิ่มเงิน'),no=el('button','btn no','ไม่ผ่าน');
      ok.onclick=async()=>{
        const a=parseAmt(amt.value);
        if(!a){toast('กรอกจำนวนเงินเป็นตัวเลขที่มากกว่า 0');return}
        if(!confirm('เพิ่มเงิน '+fmt(a)+' กีบ ให้ '+t.username+' ?'))return;
        ok.disabled=no.disabled=true;
        try{
          await runTransaction(db,async tx=>{
            const tr=doc(db,'topups',t.id),ts=await tx.get(tr);
            if(!ts.exists()||ts.data().status!=='pending')throw new Error('สลิปนี้ถูกจัดการไปแล้ว');
            const ur=doc(db,'users',t.uid),us=await tx.get(ur);
            if(!us.exists())throw new Error('ไม่พบบัญชีลูกค้า');
            tx.update(ur,{balance:(us.data().balance||0)+a});
            tx.update(tr,{status:'approved',amount:a,approvedAt:serverTimestamp()});
          });
        }catch(e){toast(emsg(e));ok.disabled=no.disabled=false}
      };
      no.onclick=async()=>{
        if(!confirm('ปฏิเสธสลิปนี้?'))return;
        ok.disabled=no.disabled=true;
        try{await updateDoc(doc(db,'topups',t.id),{status:'rejected',approvedAt:serverTimestamp()})}catch(e){toast(emsg(e));ok.disabled=no.disabled=false}
      };
      r.appendChild(ok);r.appendChild(no);c.appendChild(r);box.appendChild(c);
    });
  },e=>toast('โหลดสลิปไม่สำเร็จ: '+(e.code||'')));
}

/* 3) บัญชีผู้ใช้งาน */
function viewUsers(){
  const box=setView('ผู้ใช้งานในปัจจุบัน');
  const big=el('div','card bigc');const bn=el('div','bign','0');
  big.appendChild(el('div','mut','ผู้ใช้งานทั้งหมด'));big.appendChild(bn);big.appendChild(el('div','mut','คน'));
  const q=document.createElement('input');q.placeholder='ค้นหาชื่อผู้ใช้หรืออีเมล';q.setAttribute('aria-label','ค้นหา');q.style.marginBottom='10px';
  const cnt=el('p','mut cnt');const list=el('div');
  box.appendChild(big);box.appendChild(q);box.appendChild(cnt);box.appendChild(list);
  let rows=[];
  const draw=()=>{
    const k=q.value.trim().toLowerCase();
    const f=rows.filter(u=>!k||String(u.username).toLowerCase().includes(k)||String(u.email).toLowerCase().includes(k));
    cnt.textContent='ทั้งหมด '+rows.length+' บัญชี'+(k?' · พบ '+f.length:'');
    list.replaceChildren();
    f.forEach(u=>{const c=el('div','card');c.appendChild(el('b','',u.username));
      c.appendChild(el('div','','อีเมล: '+u.email));
      c.appendChild(el('div','ok','ยอดเงิน: '+fmt(u.balance)+' กีบ'));
      c.appendChild(el('div','mut','สมัครเมื่อ '+when(u.createdAt)));list.appendChild(c)});
  };
  q.oninput=draw;
  unsub=onSnapshot(collection(db,'users'),snap=>{
    rows=snap.docs.map(d=>d.data()).sort((a,b)=>secs(b)-secs(a));bn.textContent=fmt(rows.length);draw();
  },e=>toast('โหลดบัญชีไม่สำเร็จ: '+(e.code||'')));
}
